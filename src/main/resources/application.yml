spring:
  application:
    name: petgo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/petgo}
    username: ${DB_USERNAME:petgo}
    password: ${DB_PASSWORD:petgo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${CSV_IMPORT_MAX_BYTES:2097152}B
      max-request-size: ${CSV_IMPORT_MAX_REQUEST_SIZE:3MB}
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  csv:
    import-max-bytes: ${CSV_IMPORT_MAX_BYTES:2097152}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:petgo}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:PetGo Admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cookie-secure: ${COOKIE_SECURE:false}
