spring:
  application:
    name: petgo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/petgo}
    username: ${DB_USERNAME:petgo}
    password: ${DB_PASSWORD:petgo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
