spring:
  application:
    name: petgo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/petgo}
    username: ${DB_USERNAME:petgo}
    password: ${DB_PASSWORD:petgo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
