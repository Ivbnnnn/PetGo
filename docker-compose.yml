services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petgo
      POSTGRES_USER: petgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petgo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petgo -d petgo"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/petgo
      DB_USERNAME: petgo
      DB_PASSWORD: ${POSTGRES_PASSWORD:-petgo}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
